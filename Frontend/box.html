<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLE-BOX-JUSTFY</title>
   <style>
    .flex-box{
        border: 1px solid blue;
        height: 250px;
        display: flex;
        flex-wrap:wrap;
        gap: 10px;
        justify-content: center;
        align-items: center;

    }
    .box{
        height: 100px;
        width: 100px;
        background-color: red;
        border: 1px solid blueviolet;
        color:white;
    }
   </style>
</head>
<body>
    <div class="flex-box">
        <div class ="box">1</div>
        <div class ="box">2</div>
        <div class ="box">3</div>
        <div class ="box">4</div>
        <div class ="box">5</div>
        <div class ="box">6</div>
    </div>
</body>
</html>
