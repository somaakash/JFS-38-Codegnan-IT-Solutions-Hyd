        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background: rgb(155, 145, 155);
            height: 100vh;
            width: 100%;
        }
        .box{
            margin: 100px;
            width: 80px;
            height: 80px;
            background: orange;
            transition:  2s ease;
            border-radius: 10px;
            position: relative;
            animation: position_change 2s ease infinite;
            
        }
        @keyframes position_change {
            0%{
                left: 0;
                top: 0;
            }25%{
                left: 500px;
                top: 0;
            }50%{
                top: 500px;
                left: 500px;

            }75%{
                left: 0;
                top: 500px;

            }100%{
                left: 0;
                top: 0;
                background-color: purple;
                border-radius: 50%;

            }
        }
    </style>
